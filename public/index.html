<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나만의 AI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: #0f1115; color: #e7e9ee;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #232733; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; background: #0f1115; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; }
  nav a { color: #9aa4b2; text-decoration: none; font-size: 14px; margin-left: 12px; }
  nav a:hover { color: #e7e9ee; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 20px 40px; }
  .chat-log { min-height: 300px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
  .msg.user { background: #2b6cff; color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg.ai { background: #1a1e27; align-self: flex-start; border-bottom-left-radius: 3px; }
  .row { display: flex; gap: 8px; }
  textarea {
    width: 100%; background: #1a1e27; border: 1px solid #2b3240; color: #e7e9ee;
    border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; resize: vertical;
  }
  button {
    background: #2b6cff; color: #fff; border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>🤖 나만의 AI</h1>
  <nav>
    <a href="/index.html">챗봇</a>
    <a href="/email.html">메일 답장 도구</a>
  </nav>
</header>

<main>
  <section id="chat">
    <div class="chat-log" id="log"></div>
    <div class="row">
      <textarea id="chatInput" rows="2" placeholder="무엇이든 물어보세요..."></textarea>
      <button id="chatSend">보내기</button>
    </div>
  </section>
</main>

<script>
  const log = document.getElementById("log");
  const messages = [];
  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "ai");
    div.textContent = text;
    log.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }
  async function sendChat() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMsg("user", text);
    messages.push({ role: "user", content: text });
    const aiDiv = addMsg("ai", "…");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      const answer = data.answer || data.error || "(응답 없음)";
      aiDiv.textContent = answer;
      messages.push({ role: "assistant", content: answer });
    } catch (e) {
      aiDiv.textContent = "오류: " + e.message;
    }
  }
  document.getElementById("chatSend").addEventListener("click", sendChat);
  document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
</script>
</body>
</html>
