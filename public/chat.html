    <nav class="nav">

      <a class="nav-item" data-nav="home" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 3.5l9 7.1"></path><path d="M5.2 9.2V20h13.6V9.2"></path></svg><span>홈</span></a>

      <div>

          <button class="seg-btn" data-set="dark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.3 6.3 0 0 0 9.5 9.5Z"></path></svg><span>다크</span></button>
          <button class="seg-btn" data-set="system"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M9 20h6M12 16v4"></path></svg><span>시스템</span></button>
        </div>
      </div>
      <div class="user-wrap">
        <div id="userMenu" class="user-menu hidden">
          <div class="menu-head"><div class="n js-name">민수</div><div class="o js-org">토마토시스템</div></div>
          <button id="openSettings" class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.82-.33 1.6 1.6 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .33-1.82 1.6 1.6 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.6 1.6 0 0 0 1 1.51 1.6 1.6 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.33 1.82V9a1.6 1.6 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.6 1.6 0 0 0-1.51 1Z"></path></svg>설정</button>
          <button class="menu-item muted"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>로그아웃</button>
        </div>
        <button id="userBtn" class="user-btn">
          <div class="avatar sm js-initial">민</div>
          <div class="user-meta"><div class="user-name js-name">민수</div><div class="user-org js-org">토마토시스템</div></div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5-5 5 5"></path></svg>

  <main class="main">
    <div class="chat">
      <header class="chat-head">
        <div class="chat-head-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H8.5L4 20V5.5Z"></path></svg></div>
        <div><div class="t">챗봇</div><div class="s" id="modelLabel" title="응답에 실제로 사용된 모델">한국어 AI 비서</div></div>
        <button id="newChat" class="copy-btn" style="margin-left:auto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg> 새 대화</button>
      </header>
      <div class="chat-log scroll" id="log"><div class="chat-inner" id="inner"></div></div>
      <div class="chat-foot">
        <div class="chat-input-wrap">
          <textarea id="chatInput" class="chat-input" rows="1" placeholder="메시지를 입력하세요…"></textarea>
          <button id="chatSend" class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"></path></svg></button>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="settingsModal" class="overlay hidden">
  <div class="modal scroll">
    <div class="modal-head"><h2>설정</h2><button class="close-btn js-close-settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <div class="modal-body">
      <section>
        <div class="set-title">프로필</div>
        <div class="profile-row"><div class="avatar lg js-initial">민</div><div class="hint2">프로필에 표시되는 이름과 소속입니다.<br>이름 앞 글자가 아바타에 나타납니다.</div></div>
        <div class="set-fields">
          <div><label>이름</label><input id="setName" class="set-input" placeholder="이름"></div>
          <div><label>소속</label><input id="setOrg" class="set-input" placeholder="소속"></div>
        </div>
      </section>
      <section>
        <div class="set-title">환경설정</div>
        <div class="pref-row">
          <div><div class="n">테마</div><div class="d">화면 밝기 모드를 선택합니다.</div></div>
          <div class="theme-seg" style="flex:none;background:var(--side)">
            <button class="seg-btn" data-set="light">라이트</button>
            <button class="seg-btn" data-set="dark">다크</button>
            <button class="seg-btn" data-set="system">시스템</button>
          </div>
        </div>
      </section>
    </div>
    <div class="modal-foot"><button class="done-btn js-close-settings">완료</button></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  (function () {
    var inner = document.getElementById("inner");
    var log = document.getElementById("log");
    var input = document.getElementById("chatInput");
    var KEY = "mp-chat-history";
    var GREET = "안녕하세요! 무엇을 도와드릴까요? 질문을 입력하시면 바로 답해 드릴게요.";
    var messages = load();
    var AI_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 4v3M12 17v3M4 12h3M17 12h3"></path></svg>';

    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(messages)); } catch (e) {} }

    // 응답에 실제로 사용된 모델을 헤더에 표시 (하드코딩 아님 — 서버가 알려준 값)
    var MKEY = "mp-last-model";
    function showModel(id) {
      if (!id) return;
      try { localStorage.setItem(MKEY, id); } catch (e) {}
      var el = document.getElementById("modelLabel");
      if (!el) return;
      var parts = id.split("/");
      el.textContent = parts[parts.length - 1];   // 예: qwen3-30b-a3b-fp8
      el.title = id;                              // 전체 ID는 마우스 올리면 보임
    }
    try { showModel(localStorage.getItem(MKEY)); } catch (e) {}

    function scroll() { log.scrollTop = log.scrollHeight; }

    function addMsg(role, text) {
      var row = document.createElement("div");
      row.className = "msg-row" + (role === "user" ? " user" : "");
      if (role === "ai") { var av = document.createElement("div"); av.className = "ai-av"; av.innerHTML = AI_ICON; row.appendChild(av); }
      var b = document.createElement("div");
      b.className = "bubble" + (role === "user" ? " user" : "");
      b.textContent = text;
      row.appendChild(b);
      inner.appendChild(row);
      scroll();
      return b;
    }

    function addTyping() {
      var row = document.createElement("div");
      row.className = "msg-row";
      row.innerHTML = '<div class="ai-av">' + AI_ICON + '</div><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      inner.appendChild(row); scroll();
      return row;
    }

    // 첫 인사 + 저장된 대화 복원
    addMsg("ai", GREET);
    messages.forEach(function (m) { addMsg(m.role === "user" ? "user" : "ai", m.content); });

    async function send(text) {
      text = (text || input.value).trim();
      if (!text) return;
      input.value = "";
      addMsg("user", text);
      messages.push({ role: "user", content: text });
      save();
      var typing = addTyping();
      try {
        var res = await fetch("/api/chat", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ messages: messages })
        });
        var data = await res.json();
        var answer = data.answer || data.error || "(응답 없음)";
        typing.remove();
        addMsg("ai", answer);
        showModel(data.model);
        messages.push({ role: "assistant", content: answer });
        save();
      } catch (e) {
        typing.remove();
        messages.pop(); // 실패한 턴은 저장하지 않음
        save();
        addMsg("ai", "오류: " + e.message);
      }
    }

    // 새 대화: 기록 비우고 처음 상태로
    document.getElementById("newChat").addEventListener("click", function () {
      messages = [];
      save();
      inner.innerHTML = "";
      addMsg("ai", GREET);
      input.focus();
    });

    document.getElementById("chatSend").addEventListener("click", function () { send(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    // 홈에서 넘어온 질문 자동 전송
    var q = new URLSearchParams(location.search).get("q");
    if (q) send(q);
  })();
</script>
</body>
</html>
