</head>
<body data-page="mail">

  <aside class="side">
    <div class="brand">
      <div class="brand-logo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M5 12H3M21 12h-2M6.4 6.4 5 5M19 19l-1.4-1.4M17.6 6.4 19 5M5 19l1.4-1.4"></path><circle cx="12" cy="12" r="3.4"></circle></svg></div>
      <div class="brand-text"><div class="brand-name">나의 포털</div><div class="brand-sub">개인용 AI 작업실</div></div>
    </div>
    <nav class="nav">
      <div class="nav-label">메뉴</div>
      <a class="nav-item" data-nav="home" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 3.5l9 7.1"></path><path d="M5.2 9.2V20h13.6V9.2"></path></svg><span>홈</span></a>
      <a class="nav-item" data-nav="chat" href="chat.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v10H8.5L4 20V5.5Z"></path><path d="M8 10.2h8M8 13h5"></path></svg><span>챗봇</span></a>
      <a class="nav-item" data-nav="mail" href="email.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5.4" width="17.6" height="13.2" rx="2.2"></rect><path d="m4 7 8 6 8-6"></path></svg><span>메일 답장 도구</span></a>
      <a class="nav-item" data-nav="bot" href="bot.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7" width="15" height="11" rx="3"></rect><path d="M9 12h.01M15 12h.01M12 3.5V7M8.5 18v2M15.5 18v2"></path></svg><span>디스코드 봇</span></a>
    </nav>
    <div class="side-foot">
      <div>
        <div class="nav-label" style="padding:0 4px 7px">테마</div>
        <div class="theme-seg">
          <button class="seg-btn" data-set="light"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"></path></svg><span>라이트</span></button>
          <button class="seg-btn" data-set="dark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.3 6.3 0 0 0 9.5 9.5Z"></path></svg><span>다크</span></button>
          <button class="seg-btn" data-set="system"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M9 20h6M12 16v4"></path></svg><span>시스템</span></button>
        </div>
      </div>
      <div class="user-wrap">
        <div id="userMenu" class="user-menu hidden">
          <div class="menu-head"><div class="n js-name">민수</div><div class="o js-org">토마토시스템</div></div>
          <button id="openSettings" class="menu-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.82-.33 1.6 1.6 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .33-1.82 1.6 1.6 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6a1.6 1.6 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.6 1.6 0 0 0 1 1.51 1.6 1.6 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.33 1.82V9a1.6 1.6 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.6 1.6 0 0 0-1.51 1Z"></path></svg>설정</button>
          <button class="menu-item muted"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>로그아웃</button>
        </div>
        <button id="userBtn" class="user-btn">
          <div class="avatar sm js-initial">민</div>
          <div class="user-meta"><div class="user-name js-name">민수</div><div class="user-org js-org">토마토시스템</div></div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5-5 5 5"></path></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main scroll">
    <div class="page narrow">
      <div class="eyebrow">메일 답장 도구</div>
      <h1 class="title lg">받은 메일, 답장 초안까지</h1>
      <p class="lede sm">받은 메일을 붙여넣고 담고 싶은 내용과 톤을 적으면, 김민수 문체의 답장 초안을 만들어 드립니다.</p>

      <div class="form">
        <div class="field">
          <label>받은 메일 내용</label>
          <textarea id="email" class="control" rows="7" placeholder="받은 이메일 전문을 여기에 붙여넣으세요…"></textarea>
        </div>
        <div class="field">
          <label>답장에 넣을 내용 · 키워드 <span class="opt">(선택)</span></label>
          <textarea id="keywords" class="control" rows="8" style="min-height:150px" placeholder="예: 다음 주 화요일 미팅 가능, 자료는 이메일로 전달&#10;여러 줄로 자세히 적을수록 답장에 잘 반영돼요."></textarea>
        </div>
        <div class="field">
          <label>말투 · 톤 <span class="opt">(선택)</span></label>
          <input type="text" id="tone" class="control" placeholder="예: 정중하게 / 간결하게">
          <div class="chips">
            <button class="chip" data-tone="정중하게">정중하게</button>
            <button class="chip" data-tone="친근하게">친근하게</button>
            <button class="chip" data-tone="간결하게">간결하게</button>
          </div>
        </div>

        <div class="gen-row">
          <button id="genBtn" class="btn btn-primary btn-lg"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3"></path></svg> 답장 초안 만들기</button>
          <span class="status" id="status"></span>
        </div>

        <div id="draftCard" class="draft-card hidden">
          <div class="draft-head">
            <div class="t">답장 초안 <span style="font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:12.5px;color:var(--muted3)">· 수정해서 사용하세요</span><span id="modelLabel" style="font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:12px;color:var(--muted3)"></span></div>
            <button id="copyBtn" class="copy-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg> 복사</button>
          </div>
          <textarea id="draft" class="control" rows="12" style="border:none;background:transparent;padding:16px 0 0;border-top:1px solid var(--line2);border-radius:0"></textarea>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="settingsModal" class="overlay hidden">
  <div class="modal scroll">
    <div class="modal-head"><h2>설정</h2><button class="close-btn js-close-settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    <div class="modal-body">
      <section>
        <div class="set-title">프로필</div>
        <div class="profile-row"><div class="avatar lg js-initial">민</div><div class="hint2">프로필에 표시되는 이름과 소속입니다.<br>이름 앞 글자가 아바타에 나타납니다.</div></div>
        <div class="set-fields">
          <div><label>이름</label><input id="setName" class="set-input" placeholder="이름"></div>
          <div><label>소속</label><input id="setOrg" class="set-input" placeholder="소속"></div>
        </div>
      </section>
      <section>
        <div class="set-title">환경설정</div>
        <div class="pref-row">
          <div><div class="n">테마</div><div class="d">화면 밝기 모드를 선택합니다.</div></div>
          <div class="theme-seg" style="flex:none;background:var(--side)">
            <button class="seg-btn" data-set="light">라이트</button>
            <button class="seg-btn" data-set="dark">다크</button>
            <button class="seg-btn" data-set="system">시스템</button>
          </div>
        </div>
      </section>
    </div>
    <div class="modal-foot"><button class="done-btn js-close-settings">완료</button></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  (function () {
    document.querySelectorAll(".chip[data-tone]").forEach(function (c) {
      c.addEventListener("click", function () { document.getElementById("tone").value = c.getAttribute("data-tone"); });
    });

    document.getElementById("genBtn").addEventListener("click", async function () {
      var email = document.getElementById("email").value.trim();
      var status = document.getElementById("status");
      if (!email) { status.textContent = "받은 메일 내용을 먼저 입력해 주세요."; return; }
      var keywords = document.getElementById("keywords").value;
      var tone = document.getElementById("tone").value;
      var btn = this;
      btn.disabled = true; btn.style.opacity = ".6"; status.textContent = "초안 작성 중…";
      try {
        var res = await fetch("/api/email-reply", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: email, keywords: keywords, tone: tone })
        });
        var data = await res.json();
        if (data.draft) {
          document.getElementById("draft").value = data.draft;
          document.getElementById("draftCard").classList.remove("hidden");
          // 실제 응답에 사용된 모델 표시 (서버가 알려준 값)
          var ml = document.getElementById("modelLabel");
          if (ml && data.model) {
            var p = data.model.split("/");
            ml.textContent = " · " + p[p.length - 1];
            ml.title = data.model;
          }
          status.textContent = "";
        } else {
          status.textContent = "실패: " + (data.error || "");
        }
      } catch (e) { status.textContent = "오류: " + e.message; }
      btn.disabled = false; btn.style.opacity = "1";
    });

    document.getElementById("copyBtn").addEventListener("click", function () {
      var ta = document.getElementById("draft");
      ta.select();
      try { navigator.clipboard.writeText(ta.value); } catch (e) {}
      var b = this, html = b.innerHTML;
      b.textContent = "복사됨 ✓";
      setTimeout(function () { b.innerHTML = html; }, 1500);
    });
  })();
</script>
</body>
</html>
